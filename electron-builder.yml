appId: org.reflowpress.desktop
productName: ReflowPress
copyright: Copyright © 2026 ReflowPress contributors

directories:
  output: release-artifacts
  buildResources: build

electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

files:
  - apps/desktop/dist/**/*
  - packages/*/dist/**/*
  - packages/*/package.json
  - package.json
  - apps/desktop/package.json

fileAssociations:
  - ext: epub
    name: Electronic Publication
    description: Open with ReflowPress
    role: Editor
  - ext: pdf
    name: Portable Document Format
    description: Open with ReflowPress
    role: Viewer

protocols:
  - name: ReflowPress Protocol
    schemes:
      - reflowpress

mac:
  icon: build/icon.svg
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false

win:
  icon: build/icon.svg
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true

portable:
  artifactName: ${productName}-${version}-portable.${ext}

linux:
  icon: build/icon.svg
  maintainer: "bosatsu25 <bosatsu25@users.noreply.github.com>"
  vendor: "ReflowPress contributors"
  synopsis: "Free, local-first ebook workbench"
  syncDesktopName: true
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Office
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
