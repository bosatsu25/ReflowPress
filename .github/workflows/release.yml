name: Release Pipeline

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run build pipeline without publishing release"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  gate-validation:
    name: Release Gate Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm exec playwright install chromium
      - run: pnpm release:check

  build-artifacts:
    name: Build Distribution Packages
    needs: gate-validation
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm build
      - name: Inspect Built Renderer Bundle
        run: pnpm analyze:bundle
      - name: Package Windows Binary
        if: matrix.os == 'windows-latest'
        run: pnpm package:win
      - name: Package macOS Binary
        if: matrix.os == 'macos-latest'
        run: pnpm package:mac
      - name: Package Linux Binary
        if: matrix.os == 'ubuntu-latest'
        run: pnpm package:linux
      - name: Verify Packaged Artifacts Smoke
        run: pnpm smoke:package
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reflowpress-dist-${{ matrix.os }}
          path: release-artifacts/
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: build-artifacts
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: reflowpress-dist-*
          merge-multiple: true
      - name: Generate Cryptographic Checksums
        run: node scripts/generate-checksums.js
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*
          body_path: docs/releases/1.0.0.md
