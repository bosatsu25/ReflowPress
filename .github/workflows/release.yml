name: Release Pipeline

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run build pipeline without publishing release"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  gate-validation:
    name: Release Gate Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm exec playwright install chromium
      - run: pnpm test:version
      - run: pnpm test:api
      - run: pnpm audit --prod
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm analyze:bundle
      - run: pnpm bench

  build-artifacts:
    name: Build Distribution Packages
    needs: gate-validation
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm build
      - name: Inspect Built Renderer Bundle
        run: pnpm analyze:bundle
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reflowpress-dist-${{ matrix.os }}
          path: |
            apps/desktop/dist/
            apps/cli/dist/
            release-artifacts/
          retention-days: 14
